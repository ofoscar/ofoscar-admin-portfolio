<div>
  <label for="image-file">{{ label() }}</label>

  <input
    id="image-file"
    type="file"
    accept="image/jpeg,image/png,image/webp"
    [disabled]="uploading() || disabled()"
    (change)="onFileSelected($event)"
  />

  @if (uploading()) {
    <p role="status">Uploading image...</p>
  }

  @if (error()) {
    <p role="alert">{{ error() }}</p>
  }
</div>
