name: Test and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ vars.API_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: npm ci

      - name: Generate environment and build
        run: npm run build

      - name: Run unit tests
        run: npm test -- --no-watch --browsers=ChromeHeadless

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: angular-browser-build
          path: dist/ofoscar-angular/browser/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to EC2 with SSM
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Print OIDC subject
        shell: bash
                run: |
                  set +x
                  token_json=$(curl -fsS \
                    -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                    "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
                  id_token=$(jq -r '.value' <<< "$token_json")
                  payload=$(cut -d. -f2 <<< "$id_token" | tr '_-' '/+')
                  while (( ${#payload} % 4 )); do payload="${payload}="; done
                  printf '%s' "$payload" | base64 -d | jq -r '"sub=\(.sub)\naud=\(.aud)"'
                  
      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: angular-browser-build
          path: browser-build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload build to S3 for the EC2 instance
        env:
          S3_DEPLOY_BUCKET: ${{ vars.S3_DEPLOY_BUCKET }}
        run: |
          aws s3 sync browser-build/ "s3://$S3_DEPLOY_BUCKET/angular/${GITHUB_SHA}/" --delete

      - name: Deploy on EC2 through SSM
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          S3_DEPLOY_BUCKET: ${{ vars.S3_DEPLOY_BUCKET }}
        run: |
          set -euo pipefail
          REMOTE_COMMAND="set -euo pipefail; aws s3 sync s3://${S3_DEPLOY_BUCKET}/angular/${GITHUB_SHA}/ /home/ubuntu/ofoscar-angular/dist/ --delete"
          PARAMETERS=$(jq -n --arg command "$REMOTE_COMMAND" '{commands: [$command]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy Angular build ${GITHUB_SHA}" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" || true

          RESPONSE_CODE=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query 'ResponseCode' \
            --output text)
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID"

          if [ "$RESPONSE_CODE" != "0" ]; then
            echo "SSM deployment failed with response code: $RESPONSE_CODE"
            exit 1
          fi
